---
layout: default
---
<article class="post h-entry" itemscope itemtype="http://schema.org/BlogPosting">
  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">{{ page.title }}</h1>
    {% assign reading_time = content | number_of_words | divided_by: 225 | plus: 1 %}
    <p class="post-meta"><time class="dt-published" datetime="{{ page.date | date_to_xmlschema }}" itemprop="datePublished">{{ page.date | date: "%B %-d, %Y" }}</time><span class="post-meta-divider" aria-hidden="true">|</span><span class="post-reading-time" aria-label="Estimated reading time"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.25"/><path d="M8 4.5v3.75l2.5 1.5"/></svg>{{ reading_time }} min read</span>{% if page.repository %}<span class="post-meta-divider" aria-hidden="true">|</span><a class="post-meta-repository" href="{{ page.repository }}">GitHub</a>{% endif %}</p>
  </header>
  <div class="post-content e-content" itemprop="articleBody">{{ content }}</div>
  <a class="u-url" href="{{ page.url | relative_url }}" hidden></a>
</article>
