<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Post | Jack McCarthy</title>
  <link rel="stylesheet" href="styles.css">
  <script>MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], tags: 'ams' } };</script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="./">Jack McCarthy</a>
    <nav aria-label="Main navigation"><a href="./#writing">Writing</a><a href="about.html">About</a></nav>
  </header>
  <main><article id="post" class="intro"><p>Loading post...</p></article></main>
  <footer class="site-footer">
    <span>© 2026 Jack McCarthy</span>
    <a class="linkedin-link" href="https://www.linkedin.com/in/jwmccarthy11/" target="_blank" rel="noreferrer" aria-label="Jack McCarthy on LinkedIn">
      <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.34V9h3.42v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28ZM5.32 7.43a2.07 2.07 0 1 1 0-4.14 2.07 2.07 0 0 1 0 4.14ZM3.54 20.45H7.1V9H3.54v11.45Z"/></svg>
    </a>
  </footer>
  <script src="posts.js"></script>
  <script>
    const post = new URLSearchParams(window.location.search).get('post');
    const metadata = posts.find((item) => item.url.includes(`post=${post}`));
    fetch(metadata ? metadata.file : '')
      .then((response) => response.ok ? response.text() : Promise.reject(new Error('Post not found')))
      .then((markdown) => {
        document.title = `${metadata.title} | Jack McCarthy`;
        const math = [];
        const protectedMarkdown = markdown.replace(/\$\$[\s\S]*?\$\$|\\begin\{equation\}[\s\S]*?\\end\{equation\}|\\\([\s\S]*?\\\)/g, (match) => {
          const token = `MATHBLOCK${math.length}END`;
          math.push(match);
          return token;
        });
        let rendered = marked.parse(protectedMarkdown);
        math.forEach((value, index) => {
          const wrapper = value.startsWith('$$') ? `<div class="math-display">${value}</div>` : value;
          rendered = rendered.replace(`MATHBLOCK${index}END`, wrapper);
        });
        const date = `<p class="post-date">${new Date(`${metadata.date}T12:00:00`).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })}</p>`;
        document.querySelector('#post').innerHTML = rendered.replace('</h1>', `</h1>${date}`);
        return MathJax.startup.promise.then(() => MathJax.typesetPromise([document.querySelector('#post')]));
      })
      .catch(() => { document.querySelector('#post').innerHTML = '<h1>Post not found</h1><p><a href="./">Return home</a></p>'; });
  </script>
</body>
</html>
